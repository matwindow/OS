<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, nofollow">
    <meta name="description" content="Operating System That Fully Works In The Browser!">
    <meta name="keywords" content="HTML, HTML5, OS, Operating System, JS, TS, phy, Python, Javascript, Typescript, Web, Online, Website, Cool, Fun, Github">
    <meta name="author" content="matwindow">
    <meta name="theme-color" content="#db5151">
    <meta property="og:title" content="MatOS">
    <meta property="og:description" content="Operating System That Fully Works In The Browser!">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="png/icon.png">

    <title>MatOS</title>
    <style>
      :root{--taskbar-width:75px;--icon-size:48px}
      .normal{
         font-family: Tahoma, Geneva, sans-serif;
    font-size: 22px;
    letter-spacing: -0.4px;
    word-spacing: 2.8px;
    color: #FFFFFF;
    font-weight: 400;
    text-decoration: none;
    font-style: normal;
    font-variant: normal;
    text-transform: capitalize;
      }
        .sidebar-taskbar {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    
    width: var(--taskbar-width);
    height: 90vh;
    
    background: rgba(15, 15, 25, 0.35);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    
    box-sizing: border-box;
    z-index: 9999;
    display:flex;
    align-items:center;
    justify-content:center;
}

.sidebar-inner{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  padding:18px 8px;
  box-sizing:border-box;
}

.task-btn{
  width:var(--taskbar-width);
  height:var(--icon-size);
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:none;
  padding:4px;
  cursor:pointer;
  position:relative;
}
.task-btn:focus{outline:2px solid rgba(255,255,255,0.06);border-radius:10px}
.task-btn img{ width:var(--icon-size); height:var(--icon-size); object-fit:cover; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.5)}

/* small notification badge */
.badge{
  position:absolute;
  left:10px;
  top:6px;
  width:12px;
  height:12px;
  background:#e74c3c;
  border-radius:50%;
  box-shadow:0 2px 6px rgba(0,0,0,0.4);
  border:2px solid rgba(255,255,255,0.08);
}

      body {
            background-image: url('jpg/bg.jpg'); 
            background-repeat: no-repeat; 
            background-position: center; 
            background-size: cover; 
            background-attachment: fixed; 
            min-height: 100vh; 
            margin: 0;
        }

/* simple fake window for demo */
.fake-window{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:60vw;
  height:60vh;
  background:rgba(8,8,12,0.9);
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.06);
  box-shadow:0 20px 80px rgba(0,0,0,0.6);
  padding:12px;
  color:#fff;
  z-index:9998;
}

.close-btn{position:absolute;right:10px;top:8px;background:#222;border:none;color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer}
    </style>
    <script>
      // Taskbar icons storage and rendering
      const STORAGE_KEY = 'matos_taskbar_icons_v1';

      const defaultIcons = [
        {icon: 'png/icon.png', action: '/open Browser', title: 'Browser'},
        {icon: 'png/icon.png', action: '/open Files', title: 'Files', notify: true},
        {icon: 'png/icon.png', action: '/open Settings', title: 'Settings'}
      ];

      function loadIcons(){
        try{
          const raw = localStorage.getItem(STORAGE_KEY);
          if(!raw) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultIcons));
            return defaultIcons.slice();
          }
          const parsed = JSON.parse(raw);
          if(Array.isArray(parsed)) return parsed;
        }catch(e){console.error('Failed to load icons',e)}
        // fallback
        return defaultIcons.slice();
      }

      function saveIcons(arr){
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }catch(e){console.error('Failed to save icons',e)}
      }

      function renderTaskbar(){
        const inner = document.querySelector('.sidebar-inner');
        if(!inner) return;
        inner.innerHTML = '';
        const icons = loadIcons();
        icons.forEach((it, idx)=>{
          const btn = document.createElement('button');
          btn.className = 'task-btn';
          btn.setAttribute('data-action', it.action || '');
          btn.setAttribute('title', it.title || it.action || 'App');
          btn.setAttribute('aria-label', it.title || ('App ' + (idx+1)));

          const img = document.createElement('img');
          img.src = it.icon || 'png/icon.png';
          img.alt = it.title || 'App icon';
          btn.appendChild(img);

          if(it.notify){
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.setAttribute('aria-hidden','true');
            btn.appendChild(badge);
          }

          btn.addEventListener('click', ()=>handleAction(it, idx));

          inner.appendChild(btn);
        });
      }

      function handleAction(item, idx){
        const action = (item && item.action) || '';
        if(action.startsWith('/open ')){
          const name = action.slice(6) || 'App';
          openFakeWindow(name);
          // clear notification for this icon on open
          if(item.notify){
            const icons = loadIcons();
            if(icons[idx]){ delete icons[idx].notify; saveIcons(icons); renderTaskbar(); }
          }
          return;
        }
        // other pretend actions
        alert('Action: ' + action);
      }

      function openFakeWindow(name){
        // simple demo window
        const existing = document.querySelector('.fake-window');
        if(existing) existing.remove();
        const win = document.createElement('div');
        win.className = 'fake-window';
        win.innerHTML = `<button class="close-btn">Close</button><h2>${escapeHtml(name)}</h2><p>This is a demo window for <strong>${escapeHtml(name)}</strong>. Replace with your app implementation.</p>`;
        document.body.appendChild(win);
        win.querySelector('.close-btn').addEventListener('click', ()=>win.remove());
      }

      function escapeHtml(s){ return String(s).replace(/[&"'<>]/g, c=>({
        '&':'&amp;','"':'&quot;','\'':'&#39;','<':'&lt;','>':'&gt;'
      }[c])); }

      document.addEventListener('DOMContentLoaded', ()=>{
        renderTaskbar();

        // For debugging: expose functions
        window.matos = {loadIcons, saveIcons, renderTaskbar};
      });
    </script>
</head>
<body>
  <h1 class="normal">Test</h1>
    <div class="sidebar-taskbar" aria-label="Taskbar">
      <div class="sidebar-inner" aria-live="polite">
        <!-- Icons are rendered dynamically from localStorage -->
      </div>
    </div>

</body>
</html>
