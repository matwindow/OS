<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, nofollow">
    <meta name="description" content="Operating System That Fully Works In The Browser!">
    <meta name="keywords" content="HTML, HTML5, OS, Operating System, JS, TS, phy, Python, Javascript, Typescript, Web, Online, Website, Cool, Fun, Github">
    <meta name="author" content="matwindow">
    <meta name="theme-color" content="#db5151">
    <meta property="og:title" content="MatOS">
    <meta property="og:description" content="Operating System That Fully Works In The Browser!">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="png/icon.png">

    <title>MatOS</title>
    <style>
      :root {
        --taskbar-width: 75px;
        --icon-size: 48px;
        --window-blue: rgba(47, 91, 217, 0.92);
        --titlebar-bg: rgba(12, 12, 16, 0.9);
        --close-red: #f13b3b;
        --close-gray: rgba(78, 77, 83, 0.9);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100vh;
        overflow: hidden;
        font-family: Tahoma, Geneva, sans-serif;
      }

      body {
        background-image: url('jpg/bg.jpg');
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        background-attachment: fixed;
      }

      .sidebar-taskbar {
        position: fixed;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        width: var(--taskbar-width);
        height: 90vh;
        background: rgba(15, 15, 25, 0.35);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        box-sizing: border-box;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .sidebar-inner {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 18px 8px;
        box-sizing: border-box;
      }

      .task-btn {
        width: var(--taskbar-width);
        height: var(--icon-size);
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        padding: 4px;
        cursor: pointer;
        position: relative;
      }

      .task-btn:focus { outline: 2px solid rgba(255,255,255,0.06); border-radius: 10px; }
      .task-btn img {
        width: var(--icon-size);
        height: var(--icon-size);
        object-fit: cover;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      }

      .badge {
        position: absolute;
        left: 10px;
        top: 6px;
        width: 12px;
        height: 12px;
        background: #e74c3c;
        border-radius: 50%;
        box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        border: 2px solid rgba(255,255,255,0.08);
      }

      .demo-window {
        position: fixed;
        left: 90px;
        top: 90px;
        width: 560px;
        height: 420px;
        border: 3px solid #000;
        border-radius: 16px 16px 0 0;
        box-shadow: 0 8px 18px rgba(0,0,0,0.12);
        overflow: hidden;
        z-index: 20000;
        user-select: none;
        background: rgba(47, 91, 217, 0.52);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .demo-window.hidden { display: none; }

      .demo-window .titlebar {
        height: 42px;
        background: rgba(12, 12, 16, 0.82);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 8px 10px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }

      .window-controls {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .control-btn {
        width: 26px;
        height: 22px;
        border-radius: 4px;
        border: 1px solid rgba(255,255,255,0.25);
        background: rgba(255,255,255,0.08);
        position: relative;
        cursor: pointer;
      }

      .control-btn.minimize::before {
        content: "";
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: 5px;
        height: 3px;
        background: #fff;
        border-radius: 2px;
      }

      .control-btn.maximize::before {
        content: "";
        position: absolute;
        inset: 6px;
        border: 2px solid #fff;
        border-radius: 2px;
      }

      .control-btn.close {
        background: var(--close-gray);
      }

      .control-btn.close::before,
      .control-btn.close::after {
        content: "";
        position: absolute;
        left: 11px;
        top: 4px;
        width: 2px;
        height: 14px;
        background: #fff;
        border-radius: 2px;
      }

      .control-btn.close::before { transform: rotate(45deg); }
      .control-btn.close::after { transform: rotate(-45deg); }
      .control-btn.close:hover { background: var(--close-red); }
      .control-btn:hover { filter: brightness(1.1); }

      .demo-window .body {
        position: relative;
        width: 100%;
        height: calc(100% - 42px);
        background: rgba(10, 10, 18, 0.82);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .window-content {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        padding: 18px 18px 0 18px;
      }

      .window-title {
        font-size: 28px;
        font-weight: 700;
        color: #f3f3f3;
        margin: 0 0 12px 0;
        text-shadow: 0 0 10px rgba(0,0,0,0.2);
      }

      .window-text {
        font-size: 14px;
        color: #dfe5ff;
        margin: 0;
      }

      .blue-panel {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 175px;
        background: rgba(47, 91, 217, 0.8);
        z-index: 0;
      }

      .close-button {
        position: absolute;
        right: 14px;
        top: 8px;
        background: rgba(255,255,255,0.12);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        z-index: 5;
      }
    </style>
    <script>
      const STORAGE_KEY = 'matos_taskbar_icons_v1';
      const defaultIcons = [
        { icon: 'png/icon.png', action: '/open Browser', title: 'Browser' },
        { icon: 'png/icon.png', action: '/open Files', title: 'Files', notify: true },
        { icon: 'png/icon.png', action: '/open Settings', title: 'Settings' }
      ];

      function loadIcons() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultIcons));
            return defaultIcons.slice();
          }
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        } catch (e) {
          console.error('Failed to load icons', e);
        }
        return defaultIcons.slice();
      }

      function saveIcons(arr) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
        } catch (e) {
          console.error('Failed to save icons', e);
        }
      }

      function renderTaskbar() {
        const inner = document.querySelector('.sidebar-inner');
        if (!inner) return;
        inner.innerHTML = '';
        const icons = loadIcons();

        icons.forEach((it, idx) => {
          const btn = document.createElement('button');
          btn.className = 'task-btn';
          btn.setAttribute('data-action', it.action || '');
          btn.setAttribute('title', it.title || it.action || 'App');
          btn.setAttribute('aria-label', it.title || ('App ' + (idx + 1)));

          const img = document.createElement('img');
          img.src = it.icon || 'png/icon.png';
          img.alt = it.title || 'App icon';
          btn.appendChild(img);

          if (it.notify) {
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.setAttribute('aria-hidden', 'true');
            btn.appendChild(badge);
          }

          btn.addEventListener('click', () => handleAction(it, idx));
          inner.appendChild(btn);
        });
      }

      function handleAction(item, idx) {
        const action = (item && item.action) || '';
        if (action.startsWith('/open ')) {
          const name = action.slice(6) || 'App';
          openDemoWindow(name);
          if (item.notify) {
            const icons = loadIcons();
            if (icons[idx]) delete icons[idx].notify;
            saveIcons(icons);
            renderTaskbar();
          }
          return;
        }
        alert('Action: ' + action);
      }

      function openDemoWindow(name) {
        let win = document.querySelector('.demo-window');

        if (!win) {
          win = document.createElement('div');
          win.className = 'demo-window';
          win.innerHTML = `
            <div class="titlebar">
              <div class="window-controls">
                <button class="control-btn minimize" aria-label="Minimize window" title="Minimize"></button>
                <button class="control-btn maximize" aria-label="Maximize window" title="Maximize"></button>
                <button class="control-btn close" aria-label="Close window" title="Close"></button>
              </div>
            </div>
            <div class="body">
              <button class="close-button">Close</button>
              <div class="blue-panel"></div>
              <div class="window-content">
                <h2 class="window-title">${escapeHtml(name)}</h2>
                <p class="window-text">This is a demo window for ${escapeHtml(name)}. Replace with your app implementation.</p>
              </div>
            </div>
          `;

          const closeButtons = win.querySelectorAll('.close, .close-button');
          closeButtons.forEach(btn => btn.addEventListener('click', () => win.classList.add('hidden')));
          document.body.appendChild(win);
        }

        win.classList.remove('hidden');
        win.querySelector('.window-title').textContent = name;
        win.querySelector('.window-text').textContent = 'This is a demo window for ' + name + '. Replace with your app implementation.';
        win.style.zIndex = '20000';
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (char) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[char]));
      }

      document.addEventListener('DOMContentLoaded', () => {
        renderTaskbar();
        window.matos = { loadIcons, saveIcons, renderTaskbar, openDemoWindow };
        window.openDemoWindow = openDemoWindow;
      });
    </script>
</head>
<body>
  <div class="sidebar-taskbar" aria-label="Taskbar">
    <div class="sidebar-inner" aria-live="polite"></div>
  </div>
</body>
</html>
