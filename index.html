<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, nofollow">
    <meta name="description" content="Operating System That Fully Works In The Browser!">
    <meta name="keywords" content="HTML, HTML5, OS, Operating System, JS, TS, phy, Python, Javascript, Typescript, Web, Online, Website, Cool, Fun, Github">
    <meta name="author" content="matwindow">
    <meta name="theme-color" content="#db5151">
    <meta property="og:title" content="MatOS">
    <meta property="og:description" content="Operating System That Fully Works In The Browser!">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="png/icon.png">

    <title>MatOS</title>
    <style>
      :root{--taskbar-width:75px;--icon-size:48px;--window-bg:#2f5bd9;--titlebar-bg:#0b0b0f;--panel-bg:#d9d9d9;--close-red:#e93333;--close-gray:#4e4d53;--dark:#0e0e12;--light-text:#f3f3f3}

      *{box-sizing:border-box}
      body {
        margin:0;
        min-height:100vh;
        background:#d7d7d7;
        font-family: Tahoma, Geneva, sans-serif;
        overflow:hidden;
      }

      .page-label{
        position: absolute;
        font-size: 24px;
        font-weight: 700;
        color: #111;
        letter-spacing: 0.5px;
        user-select:none;
      }
      .page-label.left{ left: 32px; top: 18px; }
      .page-label.right{ left: 540px; top: 18px; }

      .window {
        position: absolute;
        left: 120px;
        top: 90px;
        width: 560px;
        height: 420px;
        background: var(--window-bg);
        border: 3px solid #000;
        border-radius: 16px 16px 0 0;
        box-shadow: 0 8px 18px rgba(0,0,0,0.12);
        cursor: grab;
        user-select:none;
        overflow:hidden;
      }
      .window.dragging { cursor:grabbing; }

      .titlebar {
        height: 42px;
        background: var(--titlebar-bg);
        padding: 6px 10px 6px 12px;
        display:flex;
        align-items:center;
        justify-content:flex-end;
        gap:12px;
      }

      .window-controls {
        display:flex;
        align-items:center;
        gap:12px;
      }

      .control-btn {
        width: 28px;
        height: 24px;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 4px;
        position: relative;
        background: rgba(255,255,255,0.08);
        cursor:pointer;
      }
      .control-btn.minimize::before {
        content: "";
        position:absolute;
        left: 7px; right: 7px; bottom: 6px;
        height: 3px; background:#fff; border-radius:2px;
      }
      .control-btn.maximize::before {
        content: "";
        position:absolute;
        inset:6px;
        border:2px solid #fff; border-radius: 2px;
      }
      .control-btn.close {
        background: var(--close-gray);
        border-color: rgba(255,255,255,0.2);
      }
      .control-btn.close::before,
      .control-btn.close::after {
        content: "";
        position:absolute;
        left: 12px; top: 5px; width: 2px; height: 14px; background:#fff; border-radius:2px;
      }
      .control-btn.close::before { transform: rotate(45deg); }
      .control-btn.close::after { transform: rotate(-45deg); }
      .control-btn.close:hover { background: var(--close-red); }
      .control-btn:hover{ filter:brightness(1.1); }

      .window-body {
        width:100%;
        height: calc(100% - 42px);
        background: var(--window-bg);
      }

      .taskbar-note {
        position:absolute;
        right: 340px;
        top: 80px;
        font-size: 14px;
        color:#1a1a1a;
        font-weight: 700;
        padding: 6px 10px;
        background: rgba(255,255,255,0.25);
        border-radius: 8px;
      }

      .taskbar-note .small-line {
        display:block;
        margin-top:6px;
        color:#0a0a0a;
        font-weight:600;
      }

      .sidebar-taskbar {
        position: fixed;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        width: var(--taskbar-width);
        height: 90vh;
        background: rgba(15, 15, 25, 0.35);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        box-sizing: border-box;
        z-index: 9999;
        display:flex;
        align-items:center;
        justify-content:center;
      }

      .sidebar-inner{
        width:100%;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:12px;
        padding:18px 8px;
        box-sizing:border-box;
      }

      .task-btn{
        width:var(--taskbar-width);
        height:var(--icon-size);
        display:flex;
        align-items:center;
        justify-content:center;
        background:transparent;
        border:none;
        padding:4px;
        cursor:pointer;
        position:relative;
      }
      .task-btn:focus{outline:2px solid rgba(255,255,255,0.06);border-radius:10px}
      .task-btn img{ width:var(--icon-size); height:var(--icon-size); object-fit:cover; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.5)}

      .badge{
        position:absolute;
        left:10px;
        top:6px;
        width:12px;
        height:12px;
        background:#e74c3c;
        border-radius:50%;
        box-shadow:0 2px 6px rgba(0,0,0,0.4);
        border:2px solid rgba(255,255,255,0.08);
      }

      .fake-window{
        position:fixed;
        left:50%;
        top:50%;
        transform:translate(-50%,-50%);
        width:60vw;
        height:60vh;
        background:rgba(8,8,12,0.9);
        border-radius:10px;
        border:1px solid rgba(255,255,255,0.06);
        box-shadow:0 20px 80px rgba(0,0,0,0.6);
        padding:12px;
        color:#fff;
        z-index:9998;
      }
      .close-btn{position:absolute;right:10px;top:8px;background:#222;border:none;color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer}
    </style>
    <script>
      const STORAGE_KEY = 'matos_taskbar_icons_v1';
      const defaultIcons = [
        {icon: 'png/icon.png', action: '/open Browser', title: 'Browser'},
        {icon: 'png/icon.png', action: '/open Files', title: 'Files', notify: true},
        {icon: 'png/icon.png', action: '/open Settings', title: 'Settings'}
      ];

      function loadIcons(){
        try{
          const raw = localStorage.getItem(STORAGE_KEY);
          if(!raw) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultIcons));
            return defaultIcons.slice();
          }
          const parsed = JSON.parse(raw);
          if(Array.isArray(parsed)) return parsed;
        }catch(e){console.error('Failed to load icons',e)}
        return defaultIcons.slice();
      }

      function saveIcons(arr){
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }catch(e){console.error('Failed to save icons',e)}
      }

      function renderTaskbar(){
        const inner = document.querySelector('.sidebar-inner');
        if(!inner) return;
        inner.innerHTML = '';
        const icons = loadIcons();
        icons.forEach((it, idx)=>{
          const btn = document.createElement('button');
          btn.className = 'task-btn';
          btn.setAttribute('data-action', it.action || '');
          btn.setAttribute('title', it.title || it.action || 'App');
          btn.setAttribute('aria-label', it.title || ('App ' + (idx+1)));

          const img = document.createElement('img');
          img.src = it.icon || 'png/icon.png';
          img.alt = it.title || 'App icon';
          btn.appendChild(img);

          if(it.notify){
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.setAttribute('aria-hidden','true');
            btn.appendChild(badge);
          }

          btn.addEventListener('click', ()=>handleAction(it, idx));
          inner.appendChild(btn);
        });
      }

      function handleAction(item, idx){
        const action = (item && item.action) || '';
        if(action.startsWith('/open ')){
          const name = action.slice(6) || 'App';
          openFakeWindow(name);
          if(item.notify){
            const icons = loadIcons();
            if(icons[idx]) delete icons[idx].notify;
            saveIcons(icons);
            renderTaskbar();
          }
          return;
        }
        alert('Action: ' + action);
      }

      function openFakeWindow(name){
        const existing = document.querySelector('.fake-window');
        if(existing) existing.remove();
        const win = document.createElement('div');
        win.className = 'fake-window';
        win.innerHTML = `<button class="close-btn">Close</button><h2>${escapeHtml(name)}</h2><p>This is a demo window for <strong>${escapeHtml(name)}</strong>. Replace with your app implementation.</p>`;
        document.body.appendChild(win);
        win.querySelector('.close-btn').addEventListener('click', ()=>win.remove());
      }

      function escapeHtml(s){ return String(s).replace(/[&"'<>]/g, c=>({ '&':'&amp;','"':'&quot;','\'':'&#39;','<':'&lt;','>':'&gt;' }[c])); }

      document.addEventListener('DOMContentLoaded', ()=>{
        renderTaskbar();
        window.matos = { loadIcons, saveIcons, renderTaskbar };

        const windowEl = document.querySelector('.window');
        const titlebar = document.querySelector('.titlebar');
        if(windowEl && titlebar){
          let dragging = false;
          let offsetX = 0;
          let offsetY = 0;

          titlebar.addEventListener('mousedown', (e)=>{
            dragging = true;
            windowEl.classList.add('dragging');
            const rect = windowEl.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
          });

          document.addEventListener('mousemove', (e)=>{
            if(!dragging) return;
            windowEl.style.left = (e.clientX - offsetX) + 'px';
            windowEl.style.top = (e.clientY - offsetY) + 'px';
          });

          document.addEventListener('mouseup', ()=>{
            dragging = false;
            windowEl.classList.remove('dragging');
          });
        }
      });
    </script>
</head>
<body>
  <div class="page-label left">Movable Window</div>
  <div class="page-label right">Blurry</div>

  <div class="window" aria-label="Movable demo window">
    <div class="titlebar">
      <div class="window-controls" aria-label="Window controls">
        <button class="control-btn minimize" aria-label="Minimize window"></button>
        <button class="control-btn maximize" aria-label="Maximize window"></button>
        <button class="control-btn close" aria-label="Close window"></button>
      </div>
    </div>
    <div class="window-body"></div>
  </div>

  <div class="sidebar-taskbar" aria-label="Taskbar">
    <div class="sidebar-inner" aria-live="polite"></div>
  </div>
</body>
</html>
