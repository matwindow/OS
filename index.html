<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, nofollow">
    <meta name="description" content="Operating System That Fully Works In The Browser!">
    <meta name="keywords" content="HTML, HTML5, OS, Operating System, JS, TS, phy, Python, Javascript, Typescript, Web, Online, Website, Cool, Fun, Github">
    <meta name="author" content="matwindow">
    <meta name="theme-color" content="#db5151">
    <meta property="og:title" content="MatOS">
    <meta property="og:description" content="Operating System That Fully Works In The Browser!">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="png/icon.png">

    <title>MatOS</title>
    <style>
      :root {
        --taskbar-width: 75px;
        --icon-size: 48px;
        --glass-bg: rgba(255,255,255,0.04);
        --titlebar-bg: rgba(6,6,8,0.6);
        --accent: rgba(47,91,217,0.85);
        --close-red: #f13b3b;
        --close-gray: rgba(78, 77, 83, 0.9);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100vh;
        overflow: hidden;
        font-family: Tahoma, Geneva, sans-serif;
      }

      body {
        background-image: url('jpg/bg.jpg');
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        background-attachment: fixed;
      }

      .sidebar-taskbar {
        position: fixed;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        width: var(--taskbar-width);
        height: 90vh;
        background: rgba(15, 15, 25, 0.35);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        box-sizing: border-box;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .sidebar-inner {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 18px 8px;
        box-sizing: border-box;
      }

      .task-btn {
        width: var(--taskbar-width);
        height: var(--icon-size);
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        padding: 4px;
        cursor: pointer;
        position: relative;
      }

      .task-btn:focus { outline: 2px solid rgba(255,255,255,0.06); border-radius: 10px; }
      .task-btn img {
        width: var(--icon-size);
        height: var(--icon-size);
        object-fit: cover;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      }

      .badge {
        position: absolute;
        left: 10px;
        top: 6px;
        width: 12px;
        height: 12px;
        background: #e74c3c;
        border-radius: 50%;
        box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        border: 2px solid rgba(255,255,255,0.08);
      }

      /* Window - glass style, multiple instances supported */
      .demo-window {
        position: fixed;
        left: 90px;
        top: 90px;
        width: 560px;
        height: 420px;
        border-radius: 14px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        overflow: hidden;
        z-index: 20000;
        user-select: none;
        background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
        border: 1px solid rgba(255,255,255,0.06);
        backdrop-filter: blur(14px) saturate(120%);
        -webkit-backdrop-filter: blur(14px) saturate(120%);
        touch-action: none;
      }

      .demo-window.maximized {
        left: 20px !important;
        top: 20px !important;
        width: calc(100% - 40px) !important;
        height: calc(100% - 40px) !important;
        border-radius: 10px !important;
      }

      .demo-window.hidden { display: none; }

      .demo-window .titlebar {
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
        background: rgba(6,6,8,0.6);
        cursor: grab;
        -webkit-user-drag: none;
      }
      .demo-window.dragging .titlebar { cursor: grabbing; }

      .title-left { display:flex; align-items:center; gap:10px; padding-left:8px; }
      .title-left .dot { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.08); }

      .window-controls { display:flex; gap:8px; align-items:center; padding-right:6px; }

      .control-btn {
        width: 28px;
        height: 22px;
        border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.06);
        background: rgba(255,255,255,0.03);
        position: relative;
        cursor: pointer;
        display:flex; align-items:center; justify-content:center;
      }

      .control-btn svg { width:14px; height:14px; fill:#fff; opacity:0.9 }
      .control-btn:hover { filter:brightness(1.15); }
      .control-btn.close:hover { background: var(--close-red); }

      .demo-window .body {
        position: relative;
        width: 100%;
        height: calc(100% - 44px);
        background: rgba(10,10,12,0.4);
        color: #e8eefc;
      }

      .window-content { position: relative; z-index: 2; padding: 18px; }
      .window-title { font-size: 26px; margin:0 0 8px 0; font-weight:700; }
      .window-text { margin:0; color: #dfe5ff; }

      .glass-top { position:absolute; left:0; right:0; top:0; height:160px; background: rgba(47,91,217,0.16); backdrop-filter: blur(8px); }

      /* resize handle */
      .resizer {
        position: absolute;
        width: 14px;
        height: 14px;
        right: 8px;
        bottom: 8px;
        cursor: se-resize;
        z-index: 21000;
        border-radius: 3px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.06);
      }

    </style>
    <script>
      const STORAGE_KEY = 'matos_taskbar_icons_v1';
      const defaultIcons = [
        { icon: 'png/icon.png', action: '/open Browser', title: 'Browser' },
        { icon: 'png/icon.png', action: '/open Files', title: 'Files', notify: true },
        { icon: 'png/icon.png', action: '/open Settings', title: 'Settings' }
      ];

      let zCounter = 20000;
      function bringToFront(el){ zCounter += 1; el.style.zIndex = zCounter; }

      function loadIcons() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultIcons));
            return defaultIcons.slice();
          }
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        } catch (e) { console.error('Failed to load icons', e); }
        return defaultIcons.slice();
      }

      function saveIcons(arr) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch (e) { console.error('Failed to save icons', e); }
      }

      function renderTaskbar() {
        const inner = document.querySelector('.sidebar-inner');
        if (!inner) return;
        inner.innerHTML = '';
        const icons = loadIcons();
        icons.forEach((it, idx) => {
          const btn = document.createElement('button');
          btn.className = 'task-btn';
          btn.setAttribute('data-action', it.action || '');
          btn.setAttribute('title', it.title || it.action || 'App');
          btn.setAttribute('aria-label', it.title || ('App ' + (idx + 1)));

          const img = document.createElement('img');
          img.src = it.icon || 'png/icon.png';
          img.alt = it.title || 'App icon';
          btn.appendChild(img);

          if (it.notify) {
            const badge = document.createElement('span'); badge.className = 'badge'; badge.setAttribute('aria-hidden','true'); btn.appendChild(badge);
          }

          btn.addEventListener('click', () => handleAction(it, idx));
          inner.appendChild(btn);
        });
      }

      function handleAction(item, idx) {
        const action = (item && item.action) || '';
        if (action.startsWith('/open ')) {
          const name = action.slice(6) || 'App';
          // create a new window instance each time so multiple apps can be opened
          createAppWindow(name);
          if (item.notify) {
            const icons = loadIcons();
            if (icons[idx]) delete icons[idx].notify;
            saveIcons(icons);
            renderTaskbar();
          }
          return;
        }
        alert('Action: ' + action);
      }

      function createAppWindow(name){
        const id = 'win_' + Date.now() + '_' + Math.floor(Math.random()*1000);
        const win = document.createElement('div');
        win.className = 'demo-window';
        win.setAttribute('data-win-id', id);
        win.innerHTML = `
          <div class="titlebar">
            <div class="title-left"><div class="dot"></div></div>
            <div class="window-controls">
              <button class="control-btn minimize" title="Minimize"> <svg viewBox="0 0 24 24"><rect x="4" y="14" width="16" height="2" rx="1"/></svg></button>
              <button class="control-btn maximize" title="Maximize"> <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg></button>
              <button class="control-btn close" title="Close"> <svg viewBox="0 0 24 24"><path d="M6 6 L18 18 M6 18 L18 6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button>
            </div>
          </div>
          <div class="body">
            <div class="glass-top"></div>
            <div class="window-content">
              <h2 class="window-title">${escapeHtml(name)}</h2>
              <p class="window-text">This is a demo window for ${escapeHtml(name)}. Replace with your app implementation.</p>
            </div>
            <div class="resizer" aria-hidden="true"></div>
          </div>
        `;

        // append then wire events
        document.body.appendChild(win);
        bringToFront(win);

        const closeBtn = win.querySelector('.control-btn.close');
        const minBtn = win.querySelector('.control-btn.minimize');
        const maxBtn = win.querySelector('.control-btn.maximize');
        const titlebar = win.querySelector('.titlebar');
        const resizer = win.querySelector('.resizer');

        closeBtn.addEventListener('click', () => win.remove());
        minBtn.addEventListener('click', () => win.classList.add('hidden'));
        maxBtn.addEventListener('click', () => win.classList.toggle('maximized'));

        // bring to front when clicked
        win.addEventListener('mousedown', () => bringToFront(win));

        // drag
        let dragging = false, offsetX = 0, offsetY = 0;
        titlebar.addEventListener('mousedown', (e) => {
          if (e.target.closest('.control-btn')) return; // ignore clicks on controls
          dragging = true; win.classList.add('dragging');
          const rect = win.getBoundingClientRect();
          offsetX = e.clientX - rect.left; offsetY = e.clientY - rect.top;
        });
        document.addEventListener('mousemove', (e) => {
          if (!dragging) return;
          const vw = window.innerWidth, vh = window.innerHeight;
          let left = e.clientX - offsetX, top = e.clientY - offsetY;
          left = Math.max(8, Math.min(left, vw - win.offsetWidth - 8));
          top = Math.max(8, Math.min(top, vh - win.offsetHeight - 8));
          win.style.left = left + 'px'; win.style.top = top + 'px';
        });
        document.addEventListener('mouseup', () => { if (dragging) { dragging = false; win.classList.remove('dragging'); } });

        // resize
        let resizing = false, startW = 0, startH = 0, startX = 0, startY = 0;
        resizer.addEventListener('mousedown', (e) => {
          e.stopPropagation();
          resizing = true; startW = win.offsetWidth; startH = win.offsetHeight; startX = e.clientX; startY = e.clientY;
          bringToFront(win);
        });
        document.addEventListener('mousemove', (e) => {
          if (!resizing) return;
          const dx = e.clientX - startX; const dy = e.clientY - startY;
          const newW = Math.max(200, startW + dx); const newH = Math.max(120, startH + dy);
          win.style.width = newW + 'px'; win.style.height = newH + 'px';
        });
        document.addEventListener('mouseup', () => { if (resizing) resizing = false; });

        // double click titlebar to maximize/restore
        titlebar.addEventListener('dblclick', () => win.classList.toggle('maximized'));
      }

      function escapeHtml(str) { return String(str).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[char])); }

      document.addEventListener('DOMContentLoaded', () => {
        renderTaskbar();
        window.matos = { loadIcons, saveIcons, renderTaskbar, createAppWindow };
        window.createAppWindow = createAppWindow;
      });
    </script>
</head>
<body>
  <div class="sidebar-taskbar" aria-label="Taskbar">
    <div class="sidebar-inner" aria-live="polite"></div>
  </div>
</body>
</html>
