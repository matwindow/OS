<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="CMD terminal icon">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0d1729"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1d2d44" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#131b2a" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="blur-heavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect x="22" y="22" width="176" height="176" rx="34" fill="url(#bg)" opacity="0.92"/>

  <g filter="url(#blur-heavy)" opacity="0.7">
    <circle cx="150" cy="70" r="46" fill="#4ca3ff" opacity="0.22"/>
    <circle cx="70" cy="150" r="52" fill="#54e0c0" opacity="0.18"/>
    <circle cx="150" cy="150" r="44" fill="#7a7cff" opacity="0.18"/>
  </g>

  <rect x="48" y="48" width="124" height="110" rx="18" fill="url(#screen)" stroke="rgba(255,255,255,0.18)"/>

  <g fill="#dfeeff" font-family="Menlo, Monaco, monospace" font-size="11" font-weight="700">
    <text x="62" y="78">&gt;_</text>
    <text x="62" y="96">/help</text>
    <text x="62" y="116">/ls</text>
    <text x="62" y="136">/read file.txt</text>
  </g>

  <g opacity="0.9" stroke="#8bdcff" stroke-width="2">
    <line x1="62" y1="92" x2="100" y2="92"/>
    <line x1="62" y1="112" x2="90" y2="112"/>
  </g>
</svg>
